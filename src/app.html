<!doctype html>
<html lang="en" class="lg:snap-y lg:snap-mandatory scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Christian Ferrario</title>
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
		<link rel="manifest" href="/assets/favicon/site.webmanifest">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" />
		
		<!-- OpenGraph / Social Meta Tags -->
		<meta property="og:title" content="Christian Ferrario | Software Engineer" />
		<meta property="og:description" content="Personal portfolio and software projects showcase." />
		<meta property="og:image" content="https://www.ferraa.it/assets/og-image.png" />
		<meta property="og:url" content="https://www.ferraa.it" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />

		<script>
			try {
				if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
